name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)，留空则使用 auto-<short sha>"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            binary: padavan-sim
            artifact: padavan-sim-linux-amd64
          - os: windows-latest
            binary: padavan-sim.exe
            artifact: padavan-sim-windows-amd64
          - os: macos-latest
            binary: padavan-sim
            artifact: padavan-sim-macos-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_simulator/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name padavan-sim _entry.py

      - name: Rename binary
        run: |
          mv dist/${{ matrix.binary }} dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "name=auto-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        run: |
          git fetch --tags -f
          tag_name="${{ steps.tag.outputs.name }}"
          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            git tag -d "$tag_name"
          fi
          git tag -a "$tag_name" -m "Release $tag_name"
          git push origin "$tag_name" --force

      - name: Generate release body
        id: body
        run: |
          tag_name="${{ steps.tag.outputs.name }}"
          sha="${GITHUB_SHA}"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "**Build: \`$tag_name\`**" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Commit: \`${sha:0:7}\`  \`${sha}\`" >> "$GITHUB_OUTPUT"
          echo "Event: \`${{ github.event_name }}\`" >> "$GITHUB_OUTPUT"
          echo "Triggered by: ${{ github.actor }}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "| Platform | Binary |" >> "$GITHUB_OUTPUT"
          echo "|----------|--------|" >> "$GITHUB_OUTPUT"
          echo "| Linux x86_64 | \`padavan-sim-linux-amd64\` |" >> "$GITHUB_OUTPUT"
          echo "| Windows x86_64 | \`padavan-sim-windows-amd64.exe\` |" >> "$GITHUB_OUTPUT"
          echo "| macOS x86_64 | \`padavan-sim-macos-amd64\` |" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Release ${{ steps.tag.outputs.name }}"
          body: ${{ steps.body.outputs.body }}
          files: artifacts/*/*
          draft: false
          prerelease: false
          overwrite_files: true